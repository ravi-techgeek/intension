<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intention</title>
  <link rel="icon" href="icons/icon48.png">
  <link rel="stylesheet" href="intention.css">
</head>
<body>
  <main>
    <h1 id="q">What are you here to watch?</h1>
    <form id="f" autocomplete="off" role="search">
      <label for="s" class="sr">Search YouTube</label>
      <input id="s" name="s" type="search" spellcheck="false" placeholder="e.g. kubernetes networking explained" autofocus>
    </form>
    <p class="hint"><kbd>Enter</kbd> to search &nbsp;&nbsp; <kbd>Esc</kbd> to clear &nbsp;&nbsp; or just close this tab</p>
  </main>
  <script src="intention.js"></script>
</body>
</html>
